name: Daily availability digest

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-commit
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Digest store A
        run: python digest.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          STORE_BASE_URL: ${{ secrets.STORE_BASE_URL }}
          STORE_DISPLAY_NAME: ${{ secrets.STORE_DISPLAY_NAME }}
          CATEGORY_PRIORITY: paintings,prints,apparel

      - name: Digest store B
        if: always()
        run: python digest.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          STORE_BASE_URL: ${{ secrets.STORE_B_BASE_URL }}
          STORE_DISPLAY_NAME: ${{ secrets.STORE_B_DISPLAY_NAME }}
          STORE_PLATFORM: shopify
          STATE_SUBDIR: storeb
          CATEGORY_PRIORITY: original-art,prints-posters,featured-products

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/last_digest_at.json state/storeb/last_digest_at.json
          git diff --staged --quiet || git commit -m "Update last digest timestamp"
          git push
