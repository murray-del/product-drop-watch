name: Product drop checker (store B)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-workflow-storeb
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python check.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          STORE_BASE_URL: ${{ secrets.STORE_B_BASE_URL }}
          STORE_DISPLAY_NAME: ${{ secrets.STORE_B_DISPLAY_NAME }}
          STORE_PLATFORM: shopify
          STATE_SUBDIR: storeb
          CATEGORY_PRIORITY: original-art,prints-posters,featured-products

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/storeb/seen_ids.json state/storeb/status.json state/storeb/sold_times.json state/storeb/positions.json state/storeb/reorder_events.json
          git diff --staged --quiet || git commit -m "Update seen product state (store B)"
          git push
