name: Product drop checker

on:
  schedule:
    # every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-workflow
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python check.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          STORE_BASE_URL: ${{ secrets.STORE_BASE_URL }}
          STORE_DISPLAY_NAME: ${{ secrets.STORE_DISPLAY_NAME }}
          CATEGORY_PRIORITY: paintings,prints,apparel

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen_ids.json state/status.json state/sold_times.json state/positions.json state/reorder_events.json
          git diff --staged --quiet || git commit -m "Update seen product state"
          git push
